<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A grounded Upgrade Guide for phones, plans, upgrades, trade-ins, and support." />
    <title>Upgrade Guide</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Upgrade Guide home">
        <span>Upgrade Guide</span><span class="brand-check" aria-hidden="true">✓</span>
      </a>
      <div class="topbar-actions">
        <span class="demo-label">FAQ demo</span>
        <button class="icon-button" id="clear-chat" type="button" aria-label="Clear conversation" title="Clear conversation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" /></svg>
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="chat-panel" aria-labelledby="chat-title">
        <div class="chat-header">
          <div>
            <p class="section-kicker">Customer care</p>
            <h2 id="chat-title">What can we help with?</h2>
          </div>
          <span class="availability"><span></span> Ready</span>
        </div>

        <div class="suggestions" aria-label="Suggested questions">
          <button type="button" data-question="Am I eligible to upgrade my phone?">Upgrade eligibility</button>
          <button type="button" data-question="How does Verizon trade-in credit work?">Trade-in credit</button>
          <button type="button" data-question="Can I keep my number when switching to Verizon?">Keep my number</button>
          <button type="button" data-question="Which Verizon plans support 5G?">5G plans</button>
        </div>

        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation">
          <article class="message assistant-message">
            <div class="avatar" aria-hidden="true">V</div>
            <div class="message-body">
              <p class="speaker">Upgrade Guide</p>
              <div class="bubble">Hi — ask me a general question about phones, plans, upgrades, or trade-ins. I’ll stay within the verified FAQ.</div>
            </div>
          </article>
        </div>

        <form id="chat-form" class="composer">
          <label class="sr-only" for="question">Ask a question</label>
          <textarea id="question" name="question" rows="1" maxlength="2000" placeholder="Ask about upgrades, plans, trade-ins…" required></textarea>
          <button id="send-button" type="submit" aria-label="Send question">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg>
          </button>
          <p class="composer-note">Enter to send · Shift + Enter for a new line</p>
        </form>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>

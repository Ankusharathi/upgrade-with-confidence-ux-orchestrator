services:
  - type: web
    name: upgrade-guide
    runtime: python
    plan: free
    rootDir: 04-presentation/final-submission-website/chatbot-app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false

